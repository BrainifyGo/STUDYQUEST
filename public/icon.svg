<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="StudyQuest">
  <!--
    The app icon: the brain mark from the favicon, on StudyQuest's own purple.

    Square and full-bleed on purpose. The logo in public/ is 1536x1024, so it
    cannot be an app icon without being letterboxed or cropped, and a launcher
    icon with bars down the sides reads as unfinished.

    The glyph sits inside the middle 60% so that Android's maskable crop — which
    can take a circle out of the square — never cuts into it.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c7cff"/>
      <stop offset="1" stop-color="#5a5aee"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#g)"/>

  <g transform="translate(256 256) scale(11.6) translate(-12 -12)"
     fill="none" stroke="#ffffff" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.16z"/>
    <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.16z"/>
  </g>
</svg>
